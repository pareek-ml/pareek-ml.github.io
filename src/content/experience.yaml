items:
  - id: wto
    employer: World Trade Organization
    role: AI Engineer
    location: Geneva, CH
    dates: Sep 2026 – present
    url: https://www.wto.org/
    impact: Took four AI systems into production, from trade-measure monitoring to a sovereign AI platform that every application now runs on.
    details:
      - "Scaled automated trade-measure monitoring from 7 to 16+ sources with department heads and trade analysts. Removing duplicates before AI processing cut model usage by 17%."
      - "Shipped an HS code recommender for member governments: the right code is in the top five 97% of the time, in under three seconds, and ready for the next HS revision."
      - "Built a sovereign AI platform (vLLM, Weaviate, MinIO) so no data leaves the organization's own infrastructure."
      - "Put organization-wide AI governance in place (Langfuse, guardrails): 100% of AI activity is logged and auditable."
      - "Deployed a knowledge assistant over 5,400+ internal documents that enforces each user's access rights on every query."
  - id: wto-intern
    employer: World Trade Organization
    role: Intern
    location: Geneva, CH
    dates: Mar 2026 – Sep 2026
    url: https://www.wto.org/
    impact: Showed that trade-policy monitoring could be automated, and built the prototype that later went into production.
    details:
      - "Prototyped automated trade-policy monitoring across 7 sources in 6 jurisdictions (MCP, Google ADK, FastAPI), replacing a fully manual workflow."
      - "Built a classifier over 10,000+ regulatory codes (hybrid retrieval) with 73.6% top-1 accuracy at under $0.01 per query, routing low-confidence cases to human review."
      - "Benchmarked open models (Gemma, Qwen) on the organization's own GPUs to choose the production model."
  - id: perimattic
    employer: Perimattic Inc.
    role: AI Engineer
    location: Bengaluru
    dates: Jan 2023 – Aug 2024
    url: https://perimattic.com/
    impact: Deployed conversational AI agents serving 1M+ airport travellers at 99.95% uptime.
    details:
      - "Deployed conversational AI agents (LangChain) serving 1M+ airport travellers, integrated with legacy back-end systems at 99.95% uptime."
      - "Delivered enterprise knowledge agents over Google Docs and SharePoint, giving non-technical staff plain-language access to internal knowledge."
      - "Built an LLM evaluation framework (DeepEval) that blocks a release when quality regresses."
      - "Forecast parking demand for a UK airport parking operator. The forecasts underpinned dynamic pricing that contributed to 15% revenue growth."
  - id: freelance
    employer: Freelance
    role: Junior AI Engineer
    location: Jaipur
    dates: Mar 2022 – Jul 2023
    impact: Made airport number-plate recognition 12× faster, from about 60 seconds to under 5.
    details:
      - "Built real-time number-plate recognition (YOLO) for an airport, cutting processing time from ~60 s to under 5 s."
