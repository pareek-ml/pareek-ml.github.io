items:
  - id: embed
    title: Embed
    outcome: Work alongside the people who do the job, and map the decision and workflow before writing any code.
  - id: prototype
    title: Prove it
    outcome: A working prototype on real data, so the case is proven, or the project stopped, before it gets expensive.
  - id: build
    title: Ship it
    outcome: A production system on the client's infrastructure, with evaluation, monitoring and governance built in.
  - id: handover
    title: Hand it over
    outcome: Procedures, documentation and training, so the team runs and extends it without me.
