items:
  - id: strategy
    title: Strategy
    summary: Find where AI pays back, and where it won't.
    lines:
      - Prioritizing AI agents and workflow automation in sensitive environments
      - Model selection on benchmarks, not reputation
      - Demand forecasting and dynamic pricing
      - End-user training, handoff and adoption
  - id: engineering
    title: Engineering
    summary: Build systems that run in production, on infrastructure the client controls.
    lines:
      - "Agents and retrieval: RAG, MCP, LangGraph, Google ADK"
      - "Models: PyTorch, Hugging Face, vLLM, fine-tuning"
      - "Data and search: Weaviate, Qdrant, Chroma, BM25, SQL Server, Databricks"
      - "Delivery: Docker, Kubernetes, CI/CD, FastAPI, on-premises deployment"
      - "Languages: Python, C++, SQL, TypeScript"
  - id: governance
    title: Governance
    summary: Make AI auditable and safe to scale.
    lines:
      - "Regulation: EU AI Act, GDPR, data residency"
      - "Evaluation: DeepEval, RAGAS"
      - "Monitoring: Langfuse, MLflow, Weights & Biases, Grafana"
      - Drift detection and selective retraining
