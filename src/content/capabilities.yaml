# Each column states what it gets the client. Tools live in toolkit.yaml.
items:
  - id: strategy
    title: Strategy
    summary: Find where AI pays back, and where it won't.
    lines:
      - Use cases scoped and prioritized with department heads and the analysts who do the work
      - Stop-or-scale decisions on evidence, before a pilot becomes a sunk cost
      - "Adoption: training, handoff and procedures teams actually use"
  - id: engineering
    title: Engineering
    summary: Build systems that run in production, on infrastructure the client controls.
    lines:
      - Agentic and retrieval systems, from first prototype to daily use
      - Models benchmarked and served on the client's own hardware
      - Forecasting and pricing models tied to revenue
  - id: governance
    title: Governance
    summary: Make AI auditable and safe to scale.
    lines:
      - Access rights enforced on every query
      - Release gates that block a release when quality drops
      - "A full audit trail: every AI interaction logged"
